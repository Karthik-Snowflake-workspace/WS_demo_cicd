name: "Snowflake Component: Progression Target - dcm_project"
on:
  workflow_call:
    inputs:
      action_type:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  SNOWFLAKE_ACCOUNT: "KIPI-KIPI_CUSTOMER"
  SNOWFLAKE_USER: "github_ws_demo_project_user"
  SNOWFLAKE_ROLE: "ACCOUNTADMIN"
  SNOWFLAKE_WAREHOUSE: "WALTER_SURFACE_DEMO"
  SNOWFLAKE_CLI_FEATURES_ENABLE_SNOWFLAKE_PROJECTS: "true"
  SNOWFLAKE_DATABASE: "WS_DEMO_CICD_METADATA"
  SNOWFLAKE_SCHEMA: "DCM_CONFIG"

jobs:
  dcm_project-environment-execution:
    runs-on: ubuntu-latest
    environment: dcm_project 
    steps:
      - uses: actions/checkout@v4

      - if: inputs.action_type == 'plan'
        name: "DCM Plan — Dry-run against DCM_PROJECT target only"
        uses: ./.github/workflows/modules/action-dcm-engine
        with:
          dcm_dir: "dcm_ws_demo"
          dcm_target: "WS_DEMO_DCM_METADATA"
          action_type: "plan"

      - if: inputs.action_type == 'deploy'
        name: "DCM Deploy — Apply changes to DCM_PROJECT target only"
        uses: ./.github/workflows/modules/action-dcm-engine
        with:
          dcm_dir: "dcm_ws_demo"
          dcm_target: "WS_DEMO_DCM_METADATA"
          action_type: "deploy"
